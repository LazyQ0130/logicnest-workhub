name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secrets-scan:
    name: Verified secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.30
        with:
          path: ./
          extra_args: --only-verified

  root-dependency-audit:
    name: Root dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm audit --audit-level=high

  license-dependency-audit:
    name: License server dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: services/license-server/package-lock.json
      - run: npm audit --prefix services/license-server --audit-level=high

  operations-dependency-audit:
    name: Operations center dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: services/admin-web/package-lock.json
      - run: npm audit --prefix services/admin-web --audit-level=high

  skills-audit:
    name: Skill dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Audit committed skill lockfiles
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' lockfile; do
            found=1
            directory=$(dirname "$lockfile")
            echo "Auditing $directory"
            npm audit --prefix "$directory" --audit-level=high
          done < <(find SKILLs -name package-lock.json -print0)
          if [ "$found" -eq 0 ]; then
            echo "No committed skill lockfiles found."
          fi

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          upload: never
      - name: Record CodeQL delivery mode
        shell: bash
        run: |
          {
            echo '## CodeQL'
            echo '分析已执行，但 GitHub Code Scanning 上传功能不可用。'
            echo 'SARIF 结果已保存为本次工作流的 Actions artifact。'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 14
