name: Review Inactive Work Items

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-inactive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Mark inactive items for manual review
        uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-issue-close: -1
          stale-issue-label: 'stale'
          stale-issue-message: 'This issue has been inactive for 60 days and was marked for maintainer review. It will not be closed automatically.'
          days-before-pr-stale: 30
          days-before-pr-close: -1
          stale-pr-label: 'stale'
          stale-pr-message: 'This pull request has been inactive for 30 days and was marked for maintainer review. It will not be closed automatically.'
          exempt-issue-labels: 'pinned,security,bug'
          exempt-pr-labels: 'pinned,security,work-in-progress,wip'
          exempt-draft-pr: true
          remove-stale-when-updated: true
          operations-per-run: 100
