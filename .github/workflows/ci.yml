name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  root-project:
    name: Root project
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Compile Electron main and preload
        run: npm run compile:electron
      - name: Build production bundles
        run: npm run build
      - name: Verify LogicNest branding
        run: npm run brand:scan

  license-server:
    name: License server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: services/license-server/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix services/license-server
      - name: Test
        run: npm test --prefix services/license-server
      - name: Build
        run: npm run build --prefix services/license-server

  operations-center:
    name: Operations center
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: services/admin-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix services/admin-web
      - name: Lint
        run: npm run lint --prefix services/admin-web
      - name: Test
        run: npm test --prefix services/admin-web
      - name: Build
        run: npm run build --prefix services/admin-web
