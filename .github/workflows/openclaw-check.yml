name: OpenClaw Integration Check

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**openclaw*'
      - 'src/main/libs/**openclaw*'
      - 'tests/**openclaw*'
      - '.github/workflows/openclaw-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**openclaw*'
      - 'src/main/libs/**openclaw*'
      - 'tests/**openclaw*'
      - '.github/workflows/openclaw-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-integration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Validate pinned runtime and integration scripts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');

          if (!/^v\d+\.\d+\.\d+$/.test(pkg.openclaw?.version ?? '')) {
            throw new Error(`Invalid OpenClaw version: ${pkg.openclaw?.version ?? '<missing>'}`);
          }
          if (!/^https:\/\/github\.com\/[^/]+\/[^/]+\.git$/.test(pkg.openclaw?.repo ?? '')) {
            throw new Error(`Invalid OpenClaw repository URL: ${pkg.openclaw?.repo ?? '<missing>'}`);
          }
          if (!Array.isArray(pkg.openclaw?.plugins)) {
            throw new Error('openclaw.plugins must be an array.');
          }
          for (const [index, plugin] of pkg.openclaw.plugins.entries()) {
            for (const field of ['id', 'npm', 'version']) {
              if (typeof plugin[field] !== 'string' || plugin[field].length === 0) {
                throw new Error(`OpenClaw plugin ${index} is missing ${field}.`);
              }
            }
          }

          const requiredScripts = [
            'scripts/ensure-openclaw-version.cjs',
            'scripts/apply-openclaw-patches.cjs',
            'scripts/run-build-openclaw-runtime.cjs',
            'scripts/sync-openclaw-runtime-current.cjs',
            'scripts/bundle-openclaw-gateway.cjs',
            'scripts/ensure-openclaw-plugins.cjs',
            'scripts/sync-local-openclaw-extensions.cjs',
            'scripts/precompile-openclaw-extensions.cjs',
            'scripts/install-openclaw-channel-deps.cjs',
            'scripts/prune-openclaw-runtime.cjs',
          ];
          const missing = requiredScripts.filter((file) => !fs.existsSync(file));
          if (missing.length > 0) {
            throw new Error(`Missing OpenClaw integration scripts: ${missing.join(', ')}`);
          }

          console.log(`OpenClaw ${pkg.openclaw.version}: ${pkg.openclaw.plugins.length} plugins and ${requiredScripts.length} integration scripts validated.`);
          NODE
