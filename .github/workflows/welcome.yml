name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            感谢提交逻栖工枢（LogicNest WorkHub）的首个 Issue。请确认问题描述、复现步骤、环境信息和已脱敏日志完整，维护者会按项目优先级进行处理。

            Thank you for opening your first LogicNest WorkHub issue. Please make sure the description, reproduction steps, environment details, and redacted logs are complete. A maintainer will review it according to project priorities.
          pr-message: |
            感谢提交逻栖工枢（LogicNest WorkHub）的首个 Pull Request。请确认变更范围清晰、相关验证已完成、UI 变更附有截图，并且未提交密钥或本地运行数据。

            Thank you for your first LogicNest WorkHub pull request. Please confirm that the scope is clear, relevant checks pass, UI changes include screenshots, and no secrets or local runtime data are included.
