name: Build Platforms

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build an unsigned macOS artifact'
        required: true
        default: false
        type: boolean
      build_windows:
        description: 'Build an unsigned Windows artifact'
        required: true
        default: false
        type: boolean
      build_linux:
        description: 'Build a Linux artifact'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-platforms-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LOGICNEST_UNSIGNED_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build unsigned macOS package
        run: npm run dist:mac:arm64
      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: logicnest-workhub-macos-unsigned
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LOGICNEST_UNSIGNED_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare portable Python runtime
        run: npm run setup:python-runtime
      - name: Build unsigned Windows package
        run: npm run dist:win
      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: logicnest-workhub-windows-unsigned
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0
      - name: Install locked dependencies
        run: npm ci
      - name: Build Linux packages
        run: npm run dist:linux
      - name: Upload Linux workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: logicnest-workhub-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7
