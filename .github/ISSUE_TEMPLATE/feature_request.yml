name: Improvement proposal / 改进建议
description: Propose a scoped improvement for LogicNest WorkHub
title: '[Proposal] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        本模板用于逻栖工枢（LogicNest WorkHub）内部项目协作。请聚焦问题、约束和验收标准，避免营销性描述。

  - type: textarea
    id: problem
    attributes:
      label: Problem / 待解决问题
      description: Describe the concrete user or operational problem.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Proposed scope / 建议范围
      description: State what should change and what must remain unchanged.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / 验收标准
      placeholder: |
        - [ ] Observable outcome 1
        - [ ] Observable outcome 2
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and alternatives / 风险与替代方案

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist / 检查项
      options:
        - label: I searched existing issues and proposals.
          required: true
        - label: The proposal contains no credentials, private customer data, or activation-card data.
          required: true
