name: logicnest-license-e2e

services:
  mysql-e2e:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--skip-name-resolve']
    volumes:
      - logicnest_mysql_e2e_data:/var/lib/mysql
    ports:
      - '127.0.0.1:${MYSQL_PORT:-13316}:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 24
    networks: [license-e2e]

  license-server-e2e:
    build: .
    restart: unless-stopped
    env_file: .dev-secrets/e2e-state.env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql-e2e:3306/${MYSQL_DATABASE}
      HOST: 0.0.0.0
      PORT: 8787
      REQUIRE_HTTPS: 'false'
    depends_on:
      mysql-e2e:
        condition: service_healthy
    ports:
      - '127.0.0.1:${LICENSE_SERVER_PORT}:8787'
    networks:
      license-e2e:
        aliases: [license-server]

  admin-web-e2e:
    build:
      context: ../admin-web
    restart: unless-stopped
    depends_on:
      license-server-e2e:
        condition: service_healthy
    ports:
      - '127.0.0.1:${ADMIN_WEB_PORT}:80'
    networks: [license-e2e]

volumes:
  logicnest_mysql_e2e_data:

networks:
  license-e2e:
    driver: bridge
